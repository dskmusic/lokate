{% extends "sqladmin/layout.html" %}
{% block content_header %}{% endblock %}
{% block content %}
<div class="col-12 col-md-6">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">{{ t('avatar_photo_of') }} {{ target_user.display_name }}</h3>
    </div>
    <div class="card-body">
      {% if target_user.avatar_url %}
      <img src="{{ target_user.avatar_url }}"
           style="width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:16px;" />
      {% endif %}
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" capture="environment" class="form-control mb-3" />
        <button type="submit" class="btn btn-primary">{{ t('upload') }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
