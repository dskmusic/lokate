name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json holds your Firebase project config and isn't committed (see
      # ../.gitignore). Add its full content as a repo secret named GOOGLE_SERVICES_JSON
      # (Settings → Secrets and variables → Actions) for this step to produce a real build —
      # without it, this workflow only gets as far as the check below.
      - name: Write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Check google-services.json is present
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json missing — add the GOOGLE_SERVICES_JSON secret to build."
            exit 0
          fi

      - name: Assemble debug APK
        if: hashFiles('android/app/google-services.json') != ''
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        if: hashFiles('android/app/google-services.json') != ''
        run: ./gradlew lint --stacktrace
